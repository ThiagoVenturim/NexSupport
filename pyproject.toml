[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-intelligence-engine"
version = "0.1.0"
description = "Support intelligence on top of help desk tickets: connectors, curated hybrid RAG, copilot, sentiment, trends and quality analytics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "nexcoder-core",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/support_engine"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S105/S106: names of environment variables that hold secrets are not secrets.
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
